[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachedsearch"
version = "0.1.0"
description = "Training-free cached exploration for test-time search in video diffusion: explore every candidate under caching, commit full compute only to the winner."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Shreshth Saini", email = "saini.2@utexas.edu" }]
keywords = ["video diffusion", "test-time search", "best-of-n", "caching", "diffusers", "wan", "hunyuanvideo", "ltx-video", "cogvideox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1", "diffusers>=0.32", "numpy"]

[project.optional-dependencies]
imagereward = ["image-reward", "pillow"]
examples = ["imageio", "imageio-ffmpeg", "transformers", "accelerate"]

[project.urls]
Homepage = "https://shreshthsaini.github.io/CachedSearch/"
Repository = "https://github.com/shreshthsaini/CachedSearch"
Paper = "https://arxiv.org/abs/2607.23159"
Blog = "https://shreshthsaini.github.io/blogs/cachedsearch.html"

[tool.setuptools]
packages = ["cachedsearch"]
